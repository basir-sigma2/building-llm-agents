<svg width="100%" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">The generator / critic pair</title>
<desc id="d">A writer produces a draft, a critic returns concrete feedback, the writer revises, and this repeats for a bounded number of rounds, with quality climbing each round.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  .title{font-size:27px;font-weight:700;fill:#243038;}
  .sub{font-size:15px;fill:#6B7785;}
  .take{font-size:13.5px;fill:#2E3038;}
  .nt{font-size:16px;font-weight:700;fill:#FFFFFF;}
  .ns{font-size:11px;fill:#FFFFFF;fill-opacity:.85;}
  .lbl{font-size:12px;font-weight:600;fill:#6B7785;}
  .badge{font-size:11px;font-weight:600;}
  .qx{font-size:11px;font-weight:600;fill:#007C92;}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="540" fill="#FFFFFF"/>
<text class="title" x="56" y="52">The generator / critic pair</text>
<text class="sub" x="56" y="80">A writer drafts, a critic gives feedback, the writer revises &#8212; for a bounded number of rounds.</text>
<line x1="56" y1="96" x2="944" y2="96" stroke="#E6E9EC" stroke-width="1"/>

<rect x="320" y="150" width="360" height="26" rx="13" fill="#FFEDE5" stroke="#FBD9CB"/>
<text class="badge" x="500" y="167" text-anchor="middle" fill="#B4471F">round 1 &#183; 2 &#183; 3 &#8230;  &#8212;  hard cap on rounds</text>

<rect x="120" y="250" width="220" height="100" rx="16" fill="#007C92"/>
<text class="nt" x="230" y="294" text-anchor="middle">Writer</text>
<text class="ns" x="230" y="314" text-anchor="middle">produces a draft</text>

<rect x="660" y="250" width="220" height="100" rx="16" fill="#FF956E"/>
<text class="nt" x="770" y="294" text-anchor="middle" fill="#4A1B0C">Critic</text>
<text class="ns" x="770" y="314" text-anchor="middle" fill="#4A1B0C" fill-opacity="0.75">reviews, high standards</text>

<path d="M340 282 L656 282" fill="none" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="498" y="274" text-anchor="middle">draft</text>
<path d="M660 322 L344 322" fill="none" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="498" y="340" text-anchor="middle">feedback &#8594; revise</text>

<text class="qx" x="500" y="420" text-anchor="middle">quality climbs each round</text>
<rect x="412" y="450" width="14" height="16" rx="2" fill="#C9E5EA"/>
<rect x="432" y="442" width="14" height="24" rx="2" fill="#9FD0DA"/>
<rect x="452" y="432" width="14" height="34" rx="2" fill="#5DBBC9"/>
<rect x="472" y="420" width="14" height="46" rx="2" fill="#1F8EA1"/>
<rect x="492" y="406" width="14" height="60" rx="2" fill="#007C92"/>
<line x1="408" y1="466" x2="590" y2="466" stroke="#C9CFD3" stroke-width="1"/>

<line x1="56" y1="494" x2="944" y2="494" stroke="#E6E9EC" stroke-width="1"/>
<text class="take" x="56" y="522">Quality climbs with each draft&#8211;critique&#8211;revise round, but the loop must be capped &#8212; not an endless back-and-forth.</text>
</svg>
