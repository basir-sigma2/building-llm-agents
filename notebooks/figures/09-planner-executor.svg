<svg width="100%" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Planner to Executor</title>
<desc id="d">Phase one: a planner turns a goal into an inspectable plan, an ordered list of steps. Phase two: an executor works through the plan one step at a time, carrying each result forward.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  .mono{font-family:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;}
  .title{font-size:27px;font-weight:700;fill:#243038;}
  .sub{font-size:15px;fill:#6B7785;}
  .take{font-size:13.5px;fill:#2E3038;}
  .phase{font-size:13px;font-weight:700;fill:#6B7785;}
  .nt{font-size:15px;font-weight:700;fill:#FFFFFF;}
  .lt{font-size:13px;font-weight:600;}
  .code{font-size:12px;fill:#243038;}
  .lbl{font-size:11px;font-weight:600;fill:#6B7785;}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="1080" height="560" fill="#FFFFFF"/>
<text class="title" x="56" y="52">Planner &#8594; Executor</text>
<text class="sub" x="56" y="80">The planner turns a goal into an inspectable plan; the executor works through it step by step.</text>
<line x1="56" y1="96" x2="1024" y2="96" stroke="#E6E9EC" stroke-width="1"/>

<rect x="70" y="150" width="440" height="300" rx="16" fill="#FBFCFC" stroke="#CBD1D5" stroke-dasharray="5 4"/>
<text class="phase" x="92" y="178">Phase 1 &#183; Planner</text>
<rect x="120" y="206" width="340" height="40" rx="9" fill="#E1F0F3" stroke="#C5E0E6"/>
<rect x="126" y="215" width="4" height="22" rx="2" fill="#007C92"/>
<text class="code" x="140" y="231" fill="#044A55">Goal: write a report on X</text>
<line x1="290" y1="248" x2="290" y2="270" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="272" width="180" height="60" rx="14" fill="#007C92"/>
<text class="nt" x="290" y="308" text-anchor="middle">Planner</text>
<line x1="290" y1="334" x2="290" y2="356" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="120" y="358" width="340" height="74" rx="14" fill="#ECEEF1" stroke="#D8DDE1"/>
<text class="lt" x="140" y="384" fill="#51626F">Plan &#183; inspectable data</text>
<text class="code mono" x="140" y="410">[ step 1, step 2, step 3 ]</text>

<rect x="570" y="150" width="440" height="300" rx="16" fill="#FBFCFC" stroke="#CBD1D5" stroke-dasharray="5 4"/>
<text class="phase" x="592" y="178">Phase 2 &#183; Executor</text>
<rect x="700" y="200" width="180" height="56" rx="14" fill="#007C92"/>
<text class="nt" x="790" y="234" text-anchor="middle">Executor</text>
<rect x="600" y="282" width="380" height="38" rx="9" fill="#E6F0F2" stroke="#C5E0E6"/>
<text class="code mono" x="616" y="306" fill="#044A55">1. fetch sources</text>
<rect x="600" y="336" width="380" height="38" rx="9" fill="#E6F0F2" stroke="#C5E0E6"/>
<text class="code mono" x="616" y="360" fill="#044A55">2. summarise each</text>
<rect x="600" y="390" width="380" height="38" rx="9" fill="#E6F0F2" stroke="#C5E0E6"/>
<text class="code mono" x="616" y="414" fill="#044A55">3. write the report</text>
<line x1="790" y1="256" x2="790" y2="278" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="945" y1="320" x2="945" y2="336" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="945" y1="374" x2="945" y2="390" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="966" y="332" text-anchor="end">result &#8595;</text>
<text class="lbl" x="966" y="386" text-anchor="end">result &#8595;</text>

<line x1="462" y1="395" x2="696" y2="240" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="540" y="300" text-anchor="middle">consumes the plan</text>

<line x1="56" y1="510" x2="1024" y2="510" stroke="#E6E9EC" stroke-width="1"/>
<text class="take" x="56" y="538">Planning produces a checkable artefact &#8212; an ordered list of steps; execution consumes it one step at a time, carrying results forward.</text>
</svg>
