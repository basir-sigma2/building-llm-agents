<svg width="100%" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Guardrails around an agent</title>
<desc id="d">Four independent, stackable safety layers surround the agent at the centre: a step budget, a restricted toolset, argument validation, and human-in-the-loop approval.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  .title{font-size:27px;font-weight:700;fill:#243038;}
  .sub{font-size:15px;fill:#6B7785;}
  .take{font-size:13.5px;fill:#2E3038;}
  .lname{font-size:14px;font-weight:700;}
  .lsub{font-size:11px;fill:#6B7785;}
  .num{font-size:12px;font-weight:700;fill:#FFFFFF;}
  .ag{font-size:15px;font-weight:700;fill:#FFFFFF;}
</style>
<rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>
<text class="title" x="56" y="52">Guardrails around an agent</text>
<text class="sub" x="56" y="80">Four independent safety layers you can stack around the model &#8212; each a separate, complementary defence.</text>
<line x1="56" y1="96" x2="944" y2="96" stroke="#E6E9EC" stroke-width="1"/>

<rect x="120" y="140" width="760" height="400" rx="22" fill="#F4F6F7" stroke="#D8DDE1"/>
<circle cx="150" cy="170" r="11" fill="#51626F"/>
<text class="num" x="150" y="174" text-anchor="middle">4</text>
<text class="lname" x="170" y="168" fill="#51626F">Human-in-the-loop approval</text>
<text class="lsub" x="170" y="184">a person confirms risky actions</text>

<rect x="180" y="208" width="640" height="280" rx="18" fill="#ECEEF1" stroke="#D8DDE1"/>
<circle cx="210" cy="238" r="11" fill="#51626F"/>
<text class="num" x="210" y="242" text-anchor="middle">3</text>
<text class="lname" x="230" y="236" fill="#51626F">Argument validation</text>
<text class="lsub" x="230" y="252">sandbox rejects bad inputs, e.g. escaping paths</text>

<rect x="250" y="276" width="500" height="184" rx="16" fill="#E6F0F2" stroke="#C5E0E6"/>
<circle cx="280" cy="306" r="11" fill="#007C92"/>
<text class="num" x="280" y="310" text-anchor="middle">2</text>
<text class="lname" x="300" y="304" fill="#044A55">Restricted toolset</text>
<text class="lsub" x="300" y="320">only the tools you give it</text>

<rect x="320" y="344" width="360" height="92" rx="14" fill="#E1F0F3" stroke="#C5E0E6"/>
<circle cx="350" cy="372" r="11" fill="#007C92"/>
<text class="num" x="350" y="376" text-anchor="middle">1</text>
<text class="lname" x="370" y="370" fill="#044A55">Step budget</text>
<text class="lsub" x="370" y="386">max-steps cap stops runaway loops</text>

<rect x="420" y="398" width="160" height="30" rx="10" fill="#007C92"/>
<text class="ag" x="500" y="418" text-anchor="middle">Agent</text>

<line x1="56" y1="560" x2="944" y2="560" stroke="#E6E9EC" stroke-width="1"/>
<text class="take" x="56" y="588">Step budget, restricted toolset, argument validation, and human approval stack together &#8212; layered defences around the agent, not optional extras.</text>
</svg>
