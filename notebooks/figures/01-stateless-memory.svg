<svg width="100%" viewBox="0 0 1080 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">A language model has no memory of its own</title>
<desc id="d">Two turns of a conversation. Each turn resends the full message list to the same stateless model. Turn 2 resends Turn 1's system, user and assistant messages as history, then adds one new user question.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  .title{font-size:27px;font-weight:700;fill:#243038;}
  .sub{font-size:15px;fill:#6B7785;}
  .turntag{font-size:13px;font-weight:600;fill:#FFFFFF;}
  .mini{font-size:12px;font-weight:600;fill:#6B7785;letter-spacing:.3px;}
  .role{font-size:10.5px;font-weight:700;letter-spacing:.6px;}
  .content{font-size:14px;fill:#243038;}
  .modeltxt{font-size:19px;font-weight:700;fill:#FFFFFF;}
  .modelsub{font-size:11.5px;fill:#FFFFFF;fill-opacity:.85;}
  .flag{font-size:10px;font-weight:600;}
  .note{font-size:11.5px;font-weight:600;fill:#007C92;}
  .take{font-size:13.5px;fill:#2E3942;}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1080" height="740" fill="#FFFFFF"/>

<text class="title" x="56" y="52">A language model has no memory of its own</text>
<text class="sub" x="56" y="80">A multi-turn &#8220;conversation&#8221; is an illusion you maintain by resending the full message history on every call.</text>
<line x1="56" y1="96" x2="1024" y2="96" stroke="#E6E9EC" stroke-width="1"/>

<rect x="56" y="116" width="80" height="28" rx="14" fill="#007C92"/>
<text class="turntag" x="96" y="134" text-anchor="middle">Turn 1</text>
<text class="mini" x="56" y="172">Messages you send</text>
<text class="mini" x="720" y="172">Model returns</text>

<g>
  <rect x="56" y="184" width="300" height="46" rx="9" fill="#ECEEF1" stroke="#D8DDE1" stroke-width="1"/>
  <rect x="64" y="193" width="4" height="28" rx="2" fill="#51626F"/>
  <text class="role" x="76" y="203" fill="#51626F">SYSTEM</text>
  <text class="content" x="76" y="219">You are a helpful assistant.</text>
</g>
<g>
  <rect x="56" y="244" width="300" height="46" rx="9" fill="#E1F0F3" stroke="#C5E0E6" stroke-width="1"/>
  <rect x="64" y="253" width="4" height="28" rx="2" fill="#007C92"/>
  <text class="role" x="76" y="263" fill="#007C92">USER</text>
  <text class="content" x="76" y="279">What&#8217;s the capital of France?</text>
</g>

<line x1="356" y1="237" x2="462" y2="237" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="470" y="191" width="150" height="92" rx="12" fill="#007C92"/>
<text class="modeltxt" x="545" y="235" text-anchor="middle">LLM</text>
<text class="modelsub" x="545" y="257" text-anchor="middle">holds no state</text>
<line x1="620" y1="237" x2="712" y2="237" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>

<g>
  <rect x="720" y="214" width="300" height="46" rx="9" fill="#FFEDE5" stroke="#FBD9CB" stroke-width="1"/>
  <rect x="728" y="223" width="4" height="28" rx="2" fill="#FF956E"/>
  <text class="role" x="740" y="233" fill="#B4471F">ASSISTANT</text>
  <text class="content" x="740" y="249">Paris.</text>
</g>

<line x1="56" y1="330" x2="1024" y2="330" stroke="#E6E9EC" stroke-width="1"/>
<line x1="545" y1="285" x2="545" y2="485" stroke="#007C92" stroke-width="1.4" stroke-dasharray="3 5" stroke-opacity="0.55"/>
<text class="note" x="560" y="378">same model,</text>
<text class="note" x="560" y="393">called again</text>

<rect x="56" y="352" width="80" height="28" rx="14" fill="#007C92"/>
<text class="turntag" x="96" y="370" text-anchor="middle">Turn 2</text>
<text class="mini" x="56" y="408">Messages you send</text>
<text class="mini" x="720" y="408">Model returns</text>

<g>
  <rect x="56" y="420" width="300" height="46" rx="9" fill="#ECEEF1" stroke="#D8DDE1" stroke-width="1"/>
  <rect x="64" y="429" width="4" height="28" rx="2" fill="#51626F"/>
  <text class="role" x="76" y="439" fill="#51626F">SYSTEM</text>
  <text class="content" x="76" y="455">You are a helpful assistant.</text>
  <text class="flag" x="342" y="439" text-anchor="end" fill="#9AA4AD">resent</text>
</g>
<g>
  <rect x="56" y="480" width="300" height="46" rx="9" fill="#E1F0F3" stroke="#C5E0E6" stroke-width="1"/>
  <rect x="64" y="489" width="4" height="28" rx="2" fill="#007C92"/>
  <text class="role" x="76" y="499" fill="#007C92">USER</text>
  <text class="content" x="76" y="515">What&#8217;s the capital of France?</text>
  <text class="flag" x="342" y="499" text-anchor="end" fill="#9AA4AD">resent</text>
</g>
<g>
  <rect x="56" y="540" width="300" height="46" rx="9" fill="#FFEDE5" stroke="#FBD9CB" stroke-width="1"/>
  <rect x="64" y="549" width="4" height="28" rx="2" fill="#FF956E"/>
  <text class="role" x="76" y="559" fill="#B4471F">ASSISTANT</text>
  <text class="content" x="76" y="575">Paris.</text>
  <text class="flag" x="342" y="559" text-anchor="end" fill="#9AA4AD">resent</text>
</g>
<g>
  <rect x="56" y="600" width="300" height="46" rx="9" fill="#E1F0F3" stroke="#FF956E" stroke-width="1.6"/>
  <rect x="64" y="609" width="4" height="28" rx="2" fill="#007C92"/>
  <text class="role" x="76" y="619" fill="#007C92">USER</text>
  <text class="content" x="76" y="635">What&#8217;s its population?</text>
  <text class="flag" x="342" y="619" text-anchor="end" fill="#B4471F">new</text>
</g>

<line x1="356" y1="533" x2="462" y2="533" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="470" y="487" width="150" height="92" rx="12" fill="#007C92"/>
<text class="modeltxt" x="545" y="531" text-anchor="middle">LLM</text>
<text class="modelsub" x="545" y="553" text-anchor="middle">holds no state</text>
<line x1="620" y1="533" x2="712" y2="533" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>

<g>
  <rect x="720" y="510" width="300" height="46" rx="9" fill="#FFEDE5" stroke="#FBD9CB" stroke-width="1"/>
  <rect x="728" y="519" width="4" height="28" rx="2" fill="#FF956E"/>
  <text class="role" x="740" y="529" fill="#B4471F">ASSISTANT</text>
  <text class="content" x="740" y="545">About 2.1 million.</text>
</g>

<line x1="56" y1="686" x2="1024" y2="686" stroke="#E6E9EC" stroke-width="1"/>
<text class="take" x="56" y="714">The model holds no state between calls &#8212; your code preserves the conversation by resending the entire message list every time.</text>
</svg>
