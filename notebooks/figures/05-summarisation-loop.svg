<svg width="100%" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Summarisation memory</title>
<desc id="d">Old turns pile up; when long, the model compresses them into a running summary; the next request is the summary plus only the most recent turns; then it repeats as the conversation grows.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}
  .title{font-size:27px;font-weight:700;fill:#243038;}
  .sub{font-size:15px;fill:#6B7785;}
  .take{font-size:13.5px;fill:#2E3038;}
  .nt{font-size:15px;font-weight:700;}
  .ns{font-size:10.5px;fill:#6B7785;}
  .nsw{font-size:10.5px;fill:#FFFFFF;fill-opacity:.85;}
  .lbl{font-size:11px;font-weight:600;fill:#6B7785;}
  .cap{font-size:11px;font-weight:600;}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="1080" height="560" fill="#FFFFFF"/>
<text class="title" x="56" y="52">Summarisation memory</text>
<text class="sub" x="56" y="80">Compress old turns into a running summary; rebuild each request from the summary plus only recent turns.</text>
<line x1="56" y1="96" x2="1024" y2="96" stroke="#E6E9EC" stroke-width="1"/>

<path d="M915 250 C915 150 165 150 165 250" fill="none" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="540" y="158" text-anchor="middle">conversation continues &#8212; old turns pile up again</text>

<rect x="70" y="250" width="180" height="96" rx="14" fill="#ECEEF1" stroke="#D8DDE1"/>
<rect x="80" y="264" width="5" height="68" rx="2" fill="#51626F"/>
<text class="nt" x="98" y="292" fill="#51626F">Old turns</text>
<text class="ns" x="98" y="312">pile up in a buffer</text>

<rect x="320" y="250" width="180" height="96" rx="14" fill="#007C92"/>
<text class="nt" x="410" y="292" text-anchor="middle" fill="#FFFFFF">LLM compresses</text>
<text class="nsw" x="410" y="312" text-anchor="middle">when the buffer is long</text>

<rect x="570" y="250" width="180" height="96" rx="14" fill="#FFEDE5" stroke="#FBD9CB"/>
<rect x="580" y="264" width="5" height="68" rx="2" fill="#FF956E"/>
<text class="nt" x="598" y="292" fill="#B4471F">Running summary</text>
<text class="ns" x="598" y="312">persists, updated</text>

<rect x="820" y="250" width="190" height="96" rx="14" fill="#E1F0F3" stroke="#C5E0E6"/>
<rect x="830" y="264" width="5" height="68" rx="2" fill="#007C92"/>
<text class="nt" x="848" y="292" fill="#044A55">Next request</text>
<text class="ns" x="848" y="312">summary + recent turns</text>

<line x1="250" y1="298" x2="316" y2="298" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="283" y="290" text-anchor="middle">when long</text>
<line x1="500" y1="298" x2="566" y2="298" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="750" y1="298" x2="816" y2="298" stroke="#9AA4AD" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="lbl" x="783" y="290" text-anchor="middle">build</text>

<text class="cap" x="160" y="378" fill="#B4471F">old verbatim turns dropped</text>
<text class="cap" x="915" y="378" text-anchor="middle" fill="#007C92">stays small, keeps the gist</text>

<line x1="56" y1="500" x2="1024" y2="500" stroke="#E6E9EC" stroke-width="1"/>
<text class="take" x="56" y="528">The summary persists and updates while old verbatim turns are dropped &#8212; so the prompt stays small without losing the gist.</text>
</svg>
